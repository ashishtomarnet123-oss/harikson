global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Tenant API Metrics Scraper
  # Authentication: Secured with Bearer Token & Internal IP Guard
  # Endpoint: /metrics
  - job_name: 'harikson-tenant-api'
    metrics_path: '/metrics'
    bearer_token_file: '/etc/prometheus/metrics_token'
    static_configs:
      - targets: ['tenant-api:3008']

  # Admin API Metrics Scraper
  # Authentication: Secured with Bearer Token & Internal IP Guard (172.x.x.x internal network)
  # Endpoint: /admin/metrics
  - job_name: 'harikson-admin-api'
    metrics_path: '/admin/metrics'
    bearer_token_file: '/etc/prometheus/metrics_token'
    static_configs:
      - targets: ['admin-api:4000']
