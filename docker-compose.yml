version: '3.8'

networks:
  harikson-network:
    driver: bridge

# Using local host bind mounts inside ./data directory to route data to mounted block storage

services:
  # 1. Traefik (Reverse Proxy)
  traefik:
    image: traefik:v2.11
    container_name: harikson-traefik
    restart: unless-stopped
    command:
      - '--api.dashboard=true'
      - '--ping=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entryPoint.to=websecure'
      - '--entrypoints.web.http.redirections.entryPoint.scheme=https'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.transport.respondingTimeouts.readTimeout=600s'
      - '--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=600s'
      - '--entrypoints.web.transport.respondingTimeouts.readTimeout=600s'
      - '--entrypoints.web.transport.respondingTimeouts.writeTimeout=600s'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
      - '--certificatesresolvers.letsencrypt.acme.email=neuravolt@gmail.com'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--providers.file.directory=/dynamic'
      - '--providers.file.watch=true'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_DIR:-./data}/traefik:/letsencrypt
      - ./traefik/dynamic.yml:/dynamic/dynamic.yml:ro
    networks:
      - harikson-network
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'


  # 2. Ollama (Shared AI Inference Engine)
  ollama:
    image: ollama/ollama:latest
    container_name: harikson-ollama
    restart: unless-stopped
    expose:
      - '11434'
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ${DATA_DIR:-./data}/ollama:/root/.ollama
    networks:
      - harikson-network
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 12g
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 3. PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: harikson-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5435:5432'
    environment:
      - POSTGRES_USER=neuravolt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=neuravolt
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - harikson-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neuravolt']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 4. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: harikson-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED} --maxmemory 256mb --maxmemory-policy noeviction --stop-writes-on-bgsave-error no
    expose:
      - '6379'
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    networks:
      - harikson-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256m
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 4.5. Orchestrator Service (Container Management API)
  orchestrator:
    build:
      context: ./orchestrator
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-ashishtomarnet123-oss/harikson}-orchestrator:latest
    container_name: harikson-orchestrator
    restart: unless-stopped
    environment:
      - PORT=5001
      - NODE_ENV=production
      - INTERNAL_API_SECRET
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - harikson-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 5. Tenant API (Control Plane Backend & Shared Gateway)
  tenant-api:
    build:
      context: ./harikson/tenant-api
    # Must match the tag deploy-prod.yml builds & pushes, or `docker compose
    # pull` on the server has nothing to fetch and silently keeps running
    # whatever was last built locally there, ignoring new deploys entirely.
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-ashishtomarnet123-oss/harikson}-tenant-api:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://xarwiz_tenant_app:${TENANT_DB_PASSWORD:-tenant_app_secure_password_vault}@postgres:5432/neuravolt
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}@redis:6379
      - REDIS_QUEUE_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}@redis:6379
      - JWT_SECRET
      - TENANT_MASTER_KEY
      - INTERNAL_API_SECRET
      - PAYMENT_ENCRYPTION_KEY
      - EMAIL_ENCRYPTION_KEY
      - RAZORPAY_KEY_ID
      - RAZORPAY_KEY_SECRET
      - RAZORPAY_WEBHOOK_SECRET
      - PHONEPE_MERCHANT_ID
      - PHONEPE_SALT_KEY
      - PHONEPE_SALT_INDEX
      - PHONEPE_WEBHOOK_SECRET
      - PHONEPE_ENV
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_REDIRECT_URI
      # Not sensitive (a fixed public scope list, not a credential) —
      # hardcoded directly rather than needing its own GitHub secret.
      - GOOGLE_DRIVE_SCOPES=https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/userinfo.email,https://www.googleapis.com/auth/userinfo.profile
      - PORT=3008
      - NODE_ENV=production
      - OLLAMA_HOST=http://ollama:11434
      - ALLOWED_ORIGINS=https://xarwiz.com,https://www.xarwiz.com,https://admin.xarwiz.com,http://localhost:3002,http://localhost:3018,http://localhost:3028
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - harikson-network
    security_opt:
      - no-new-privileges:true
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.tenant-api.rule=Host(`api.xarwiz.com`)'
      - 'traefik.http.routers.tenant-api.entrypoints=websecure'
      - 'traefik.http.routers.tenant-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.tenant-api.middlewares=security-headers@file,rate-limit@file'
      - 'traefik.http.services.tenant-api.loadbalancer.server.port=3008'
      - 'traefik.http.services.tenant-api.loadbalancer.healthcheck.path=/health'
      - 'traefik.http.services.tenant-api.loadbalancer.healthcheck.interval=30s'
      - 'traefik.http.services.tenant-api.loadbalancer.healthcheck.timeout=5s'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 5.5. Admin API (Control Plane Management)
  admin-api:
    build:
      context: ./admin-api
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-ashishtomarnet123-oss/harikson}-admin-api:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://xarwiz_admin_app:${ADMIN_DB_PASSWORD:-admin_app_secure_password_vault}@postgres:5432/neuravolt
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}@redis:6379
      - REDIS_QUEUE_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}@redis:6379
      - JWT_SECRET
      - PORT=4000
      - NODE_ENV=${NODE_ENV:-development}
      - TENANT_API_URL=http://tenant-api:3008
      - INTERNAL_API_SECRET
      - PAYMENT_ENCRYPTION_KEY
      - EMAIL_ENCRYPTION_KEY
      - RESEND_WEBHOOK_SECRET
      - ALLOWED_ORIGINS=https://xarwiz.com,https://www.xarwiz.com,https://admin.xarwiz.com,http://localhost:3002,http://localhost:3018,http://localhost:3028
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - harikson-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.admin-api.rule=Host(`admin-api.xarwiz.com`)'
      - 'traefik.http.routers.admin-api.entrypoints=websecure'
      - 'traefik.http.routers.admin-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.admin-api.middlewares=security-headers@file,rate-limit@file'
      - 'traefik.http.services.admin-api.loadbalancer.server.port=4000'
      - 'traefik.http.services.admin-api.loadbalancer.healthcheck.path=/health'
      - 'traefik.http.services.admin-api.loadbalancer.healthcheck.interval=30s'
      - 'traefik.http.services.admin-api.loadbalancer.healthcheck.timeout=5s'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 6. Admin Panel (Next.js Dashboard)
  admin-panel:
    build:
      context: ./admin-panel
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.xarwiz.com}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-ashishtomarnet123-oss/harikson}-admin-panel:latest
    restart: unless-stopped
    command: npx next start -p 3001
    ports:
      - '127.0.0.1:3018:3001'
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.xarwiz.com}
      - ADMIN_API_URL=http://admin-api:4000
      - DATABASE_URL=postgresql://neuravolt:${POSTGRES_PASSWORD:-neuravolt_dev_pwd}@postgres:5432/neuravolt
      - JWT_SECRET
      - NEXTAUTH_SECRET
    networks:
      - harikson-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024m
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.admin-panel.rule=Host(`admin.xarwiz.com`)'
      - 'traefik.http.routers.admin-panel.entrypoints=websecure'
      - 'traefik.http.routers.admin-panel.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.admin-panel.middlewares=security-headers@file,rate-limit@file'
      - 'traefik.http.services.admin-panel.loadbalancer.server.port=3001'
    depends_on:
      - admin-api
      - tenant-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'


  # 7. User Portal (Next.js App)
  user-portal:
    build:
      context: ./user-portal
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.xarwiz.com}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-ashishtomarnet123-oss/harikson}-user-portal:latest
    restart: unless-stopped
    command: npx next start -p 3002
    ports:
      - '127.0.0.1:3028:3002'
    environment:
      - PORT=3002
      - TENANT_API_URL=http://tenant-api:3008
      - ADMIN_PANEL_URL=http://admin-panel:3001
      - DOCKER_ENV=true
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.xarwiz.com}
      - NEXTAUTH_SECRET
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://xarwiz.com}
    networks:
      - harikson-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048m
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.user-portal.rule=Host(`xarwiz.com`) || Host(`www.xarwiz.com`)'
      - 'traefik.http.routers.user-portal.entrypoints=websecure'
      - 'traefik.http.routers.user-portal.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.user-portal.middlewares=security-headers@file,rate-limit@file'
      - 'traefik.http.services.user-portal.loadbalancer.server.port=3002'
    depends_on:
      - tenant-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
  # 8. Prometheus (Metrics Scraper)
  prometheus:
    image: prom/prometheus:latest
    container_name: harikson-prometheus
    user: '65534'
    restart: unless-stopped
    ports:
      - '127.0.0.1:9098:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./monitoring/metrics_token:/etc/prometheus/metrics_token:ro
      - ${DATA_DIR:-./data}/prometheus:/prometheus
    networks:
      - harikson-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 9. Grafana (Dashboard Visualizer)
  grafana:
    image: grafana/grafana:latest
    container_name: harikson-grafana
    user: '472'
    restart: unless-stopped
    ports:
      - '127.0.0.1:3038:3003'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_HTTP_PORT=3003
    volumes:
      - ${DATA_DIR:-./data}/grafana:/var/lib/grafana
    networks:
      - harikson-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.grafana.rule=Host(`monitor.xarwiz.com`)'
      - 'traefik.http.routers.grafana.entrypoints=websecure'
      - 'traefik.http.routers.grafana.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.grafana.middlewares=security-headers@file,rate-limit@file'
      - 'traefik.http.services.grafana.loadbalancer.server.port=3003'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3003/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
